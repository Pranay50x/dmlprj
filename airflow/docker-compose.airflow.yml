services:
  airflow-init:
    image: apache/airflow:2.9.3
    network_mode: "host"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:my-new-password@localhost:5432/postgres
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      PIP_EXTRA_REQUIREMENTS: "sqlalchemy==2.0.30 httpx==0.27.0 psycopg2-binary==2.9.9"
      PYTHONPATH: /opt/airflow/project/src
    volumes:
      - ./dags:/opt/airflow/dags
      - ../src:/opt/airflow/project/src
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --password admin --firstname admin --lastname user --role Admin --email admin@example.com"

  airflow-webserver:
    image: apache/airflow:2.9.3
    network_mode: "host"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:my-new-password@localhost:5432/postgres
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      PIP_EXTRA_REQUIREMENTS: "sqlalchemy==2.0.30 httpx==0.27.0 psycopg2-binary==2.9.9"
      PYTHONPATH: /opt/airflow/project/src
    volumes:
      - ./dags:/opt/airflow/dags
      - ../src:/opt/airflow/project/src
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.3
    network_mode: "host"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:my-new-password@localhost:5432/postgres
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      PIP_EXTRA_REQUIREMENTS: "sqlalchemy==2.0.30 httpx==0.27.0 psycopg2-binary==2.9.9"
      PYTHONPATH: /opt/airflow/project/src
    volumes:
      - ./dags:/opt/airflow/dags
      - ../src:/opt/airflow/project/src
    command: scheduler
